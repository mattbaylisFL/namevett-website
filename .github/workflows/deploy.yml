name: Deploy to GitHub Pages + IndexNow

# Deploys the static site to GitHub Pages, then notifies IndexNow
# (Bing, Yandex, etc.) that the sitemap changed.
#
# Pages source is set to "GitHub Actions" — adding this workflow file
# auto-switched the build_type from "legacy" (branch /) to "workflow",
# so this workflow is now the only thing that publishes the site.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow only one concurrent deployment; let in-flight runs finish.
concurrency:
  group: "pages"
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Ping IndexNow
        run: node tools/ping-indexnow.mjs
